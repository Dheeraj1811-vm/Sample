name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      wait-minutes:
        description: "Minutes to hold the run before the checks execute"
        default: "11"

permissions:
  contents: read

# An 11 minute hold per run adds up fast when commits land back to back, so
# supersede any run still waiting on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WAIT_MINUTES: ${{ github.event.inputs.wait-minutes || 11 }}

jobs:
  wait:
    name: Wait before checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Hold the run
        run: |
          echo "Holding this run for $WAIT_MINUTES minute(s) before the checks start."
          date -u "+started  %H:%M:%SZ"
          sleep "$(( WAIT_MINUTES * 60 ))"
          date -u "+finished %H:%M:%SZ"

  lint:
    needs: wait
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Lint
        run: ruff check src/

      - name: Format check
        run: ruff format --check src/

  smoke:
    needs: wait
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Import the module
        run: python -c "import sys; sys.path.insert(0, 'src'); import scientific; print('ok')"
